services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  wordpress:
    build:
      context: .
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_URL: ${WORDPRESS_URL:-http://localhost}
      WORDPRESS_OPTIONAL_PLUGIN: ${WORDPRESS_OPTIONAL_PLUGIN:-none}
      WORDPRESS_OBJECT_CACHE: ${WORDPRESS_OBJECT_CACHE:-none}
      WORDPRESS_ADMIN_USER: ${WORDPRESS_ADMIN_USER:-admin_qmpgfd}
      WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD:-R40U8zp17YlwvQNkDEKgnhx2!@#}
      WORDPRESS_ADMIN_PASSWORD_BASE64: ${WORDPRESS_ADMIN_PASSWORD_BASE64:-}
      WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL:-admin@example.com}
    ports:
      - "127.0.0.1:${WORDPRESS_PORT:-80}:80"
    volumes:
      - wp_data:/var/www/html
      - ./wp-content:/var/www/html/wp-content
      - ./scripts:/scripts:ro
      - ./scripts/wordpress-admin-guardian.ini:/usr/local/etc/php/conf.d/wordpress-admin-guardian.ini:ro
      - ./plugins:/plugins:ro
      - ./manual:/manual:ro
      - ./snapshots:/snapshots
    networks:
      - default
      - cache
    healthcheck:
      test: ["CMD", "grep", "-qx", "ready", "/tmp/fast-wordpress-init.status"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 300s
    entrypoint: ["/scripts/entrypoint.sh"]
    command: ["apache2-foreground"]

  redis:
    image: redis:8.10.0-alpine
    profiles: ["redis"]
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - cache

  memcached:
    image: memcached:1.6.45-alpine
    profiles: ["memcached"]
    command:
      - --memory-limit=128
      - --conn-limit=1024
      - --threads=4
    healthcheck:
      test: ["CMD-SHELL", "printf 'version\\r\\n' | nc -w 1 127.0.0.1 11211 | grep -q '^VERSION'"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - cache

  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  phpmyadmin:
    image: phpmyadmin:5.2.2
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_USER: wp
      PMA_PASSWORD: wp
      UPLOAD_LIMIT: 256M
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8080}:80"

volumes:
  db_data:
  wp_data:

networks:
  cache:
    internal: true
